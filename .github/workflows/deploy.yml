name: Deploy (produção)

# Produção é a branch main: cada push aqui constrói a imagem e faz o deploy na AWS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC para assumir a role da AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Credenciais AWS via OIDC. Configure o secret AWS_DEPLOY_ROLE_ARN
      # (role com permissão de deploy/CDK) e a variável AWS_REGION no repositório.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Instalar dependências da infra
        working-directory: infra
        run: npm ci

      - name: Deploy CDK (constrói a imagem Docker e publica)
        working-directory: infra
        run: npx cdk deploy --require-approval never
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
