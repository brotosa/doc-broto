name: Deploy Cloud Run (produção)

# Faz build da imagem Docker no runner do GitHub, envia para o Artifact Registry
# e implanta no Google Cloud Run. Autentica via Workload Identity Federation (OIDC),
# sem chaves de longa duração. Configure antes (uma vez) com infra/gcp-setup.sh e
# cadastre os secrets/variables indicados. Ver infra/CLOUDRUN.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE: doc-broto
      AR_REPO: doc-broto
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login no Docker (Artifact Registry)
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build e push da imagem
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --memory 4Gi --cpu 2 \
            --timeout 600 --concurrency 4 \
            --min-instances 0 --max-instances 3

      - name: Mostrar URL pública
        run: |
          echo "URL: $(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
